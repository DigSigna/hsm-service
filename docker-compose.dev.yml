version: '3.8'

services:

  # SoftHSM (simulando el sidecar)
  softhsm:
    image: ghcr.io/digsigna/softhsm/softhsm:latest
    volumes:
      - hsm_tokens:/var/lib/softhsm/tokens
      - ./config/softhsm2.conf:/etc/softhsm2.conf
      - ./config/init-token-if-empty.sh:/usr/local/bin/init-token-if-empty.sh
    environment:
      TOKEN_LABEL: "digsigna-token"
      USER_PIN: "1234"
      SO_PIN: "5678"
      SOFTHSM2_CONF: "/etc/softhsm2.conf"
    entrypoint: >
      sh -c "
        echo '=== INICIANDO SCRIPT DE INICIALIZACIÓN ===' &&
        chmod +x /usr/local/bin/init-token-if-empty.sh &&
        /usr/local/bin/init-token-if-empty.sh &&
        echo '=== SCRIPT COMPLETADO. MOSTRANDO TOKENS ===' &&
        softhsm2-util --show-slots &&
        echo '=== MANTENIENDO CONTENEDOR ACTIVO ===' &&
        tail -f /dev/null
      "
    healthcheck:
      test: ["CMD", "softhsm2-util", "--show-slots"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hsm-network

  # HSM Service (con hot reload para desarrollo)
  hsm-service:
    build:
      context: .
      dockerfile: Dockerfile.dev 
    environment:
      HSM_ENVIRONMENT: development
      DATABASE_URL: "digsigna:AVNS_AoW9SVzq5lhLK5YhFzm@tcp(bitacoradigital-database-dec-26-backup-do-user-7050795-0.b.db.ondigitalocean.com:25060)/digsigna?tls=true&timeout=30s&parseTime=true"
      SOFTHSM2_CONF: "/etc/softhsm2.conf"
      HSM_LIBRARY_PATH: "/usr/lib/softhsm/libsofthsm2.so"
      HSM_TOKEN_LABEL: "digsigna-token"
      HSM_PIN: "1234"
      HSM_SLOT: "0"
      GIN_MODE: debug

       # AES Key Manager (emular K8s desde local)
      HSM_AESKEYMANAGER_STRATEGY: "k8s"
      HSM_AESKEYMANAGER_K8S_IN_CLUSTER: "false"
      HSM_AESKEYMANAGER_K8S_KUBECONFIG_PATH: "/root/.kube/config"
      HSM_AESKEYMANAGER_K8S_SECRET_NAME: "hsm-secrets"
      HSM_AESKEYMANAGER_K8S_SECRET_NAMESPACE: "default"
      HSM_AESKEYMANAGER_K8S_KEY_ID: "master-aes-key-v1"
      HSM_AESKEYMANAGER_K8S_MASTER_KEY_KEY: "master-aes-key-v1"
      HSM_AESKEYMANAGER_K8S_OLD_MASTER_KEY_KEY: "master-key-old"

      # Auth (local dev)
      HSM_AUTH_MODE: "development"
      HSM_AUTH_PUBLIC_KEY_PATH: "/app/certs/public.pem"
      HSM_AUTH_JWKS_URL: "http://localhost:8080/.well-known/jwks.json"
      HSM_AUTH_JWKS_CACHE_MINUTES: "60"
    volumes:
      # Montar el código fuente para hot reload
      - .:/app
      # Compartir tokens HSM con el contenedor softhsm
      - hsm_tokens:/var/lib/softhsm/tokens
      # Configuración de SoftHSM
      - ./config/softhsm2.conf:/etc/softhsm2.conf
      # Configuración de la app
      # - ./config/config.yaml:/app/config.yaml
      - ./config/config.yaml:/app/config.yaml
      # - ./config/hsm-service-config.yaml:/root/config/config.yaml
      - C:\Users\backups\.kube\config-docker.yaml:/root/.kube/config:ro
      - C:\Users\backups\.minikube:/root/.minikube:ro
    ports:
      - "8080:8080"
      - "2345:2345"  # Para debugging con delve
    depends_on:
      softhsm:
        condition: service_started
    command: air -c .air.toml
    networks:
      - hsm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  hsm_tokens:

networks:
  hsm-network:
    driver: bridge